name: Android production APK runtime

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Completed installer workflow run that contains the APK artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  android-runtime:
    name: API 36 native projection and attended control
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AURALINK_EMULATOR_SERIAL: emulator-5556
      ANDROID_AVD_HOME: ${{ github.workspace }}/.tools/avd
      ANDROID_USER_HOME: ${{ github.workspace }}/.tools/android-user
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked test dependencies
        run: npm ci
      - name: Download the actual production APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p .tools
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > .tools/runtime-build-run.json
          node - <<'JS'
          const assert=require('node:assert/strict');const fs=require('node:fs');const {spawnSync}=require('node:child_process');const run=require('./.tools/runtime-build-run.json');
          assert.equal(run.repository.full_name,process.env.GITHUB_REPOSITORY,'The APK must belong to this repository');
          assert.match(run.head_sha,/^[a-f0-9]{40}$/,'The build commit must be a full Git SHA');
          assert.equal(run.path,'.github/workflows/ci.yml','Only the installer verification workflow is accepted');
          assert.equal(run.status,'completed','The installer workflow must finish first');
          assert.equal(run.conclusion,'success','All installer workflow checks must pass before runtime testing');
          const paths=['src','android','build','scripts','package.json','package-lock.json'];
          const diff=spawnSync('git',['diff','--quiet',run.head_sha,process.env.GITHUB_SHA,'--',...paths],{encoding:'utf8'});
          assert.equal(diff.status,0,'Production source, dependencies and build scripts must match the verified APK commit');
          const source={installerRunId:run.id,installerCommit:run.head_sha,runtimeCommit:process.env.GITHUB_SHA,productionPaths:paths,productionSourcesMatch:true};
          fs.writeFileSync('.tools/runtime-source-check.json',JSON.stringify(source,null,2));
          console.log(JSON.stringify(source));
          JS
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Auralink-Android-companion --dir .tools/runtime-build
          node - <<'JS'
          const fs=require('node:fs');const path=require('node:path');const pkg=require('./package.json');
          const name=`Auralink-${pkg.version}-Android.apk`;
          const source=[path.join('.tools/runtime-build/release',name),path.join('.tools/runtime-build',name)].find(file=>fs.existsSync(file));
          if(!source)throw new Error('Production APK was absent from the build artifact');
          fs.mkdirSync('release',{recursive:true});fs.copyFileSync(source,path.join('release',name));
          JS
      - name: Prepare isolated hardware-accelerated Android 16 emulator
        run: |
          task_sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$task_sdk"
          echo "ANDROID_SDK_ROOT=$task_sdk" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          sudo chmod 666 /dev/kvm
          "$task_sdk/cmdline-tools/latest/bin/sdkmanager" --licenses <<< "$(printf 'y\n%.0s' {1..100})"
          "$task_sdk/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
          printf 'no\n' | "$task_sdk/cmdline-tools/latest/bin/avdmanager" create avd --name AuralinkAPI36 --package 'system-images;android-36;google_apis;x86_64' --device pixel_7 --path "$ANDROID_AVD_HOME/AuralinkAPI36.avd"
          cat >> "$ANDROID_AVD_HOME/AuralinkAPI36.avd/config.ini" <<'CONFIG'
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=240
          hw.ramSize=4096M
          hw.cpu.ncore=4
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          disk.dataPartition.size=2048M
          CONFIG
          "$task_sdk/emulator/emulator" -avd AuralinkAPI36 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 4096 -cores 4 -port 5556 -accel on > .tools/emulator-runtime.log 2>&1 &
      - name: Build separate non-suppressing hierarchy observer
        run: node tests/qa-hierarchy/build.cjs
      - name: Actual production WebView, native projection and Accessibility input
        run: node tests/android-emulator.cjs --control
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Auralink-Android-runtime-evidence
          path: |
            test-results/android-emulator.json
            test-results/android-emulator-lobby.png
            test-results/android-emulator-fresh-internet-setup.png
            test-results/android-emulator-invitation-dialog.png
            test-results/android-emulator-room.png
            test-results/android-emulator-microphone-permission.png
            test-results/android-emulator-audio-active.png
            test-results/android-emulator-projection-permission.png
            test-results/android-emulator-sharing.png
            test-results/android-emulator-native-control-consent.png
            test-results/android-emulator-remotely-opened-home.png
          if-no-files-found: error
          retention-days: 7
      - name: Stop the isolated emulator
        if: always()
        run: |
          "$ANDROID_SDK_ROOT/platform-tools/adb" -s emulator-5556 emu kill || true
