name: Report a bug
description: Describe a device, audio, screen or input problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: environment
    attributes:
      label: Devices and versions
      description: Release, OS, Android WebView and network arrangement. Exclude invitations/private information.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and result
      description: Include permission/approval steps, expected result and actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: For sound include failing direction and local meter response. For video include received size/fps/route. Remove secrets.
